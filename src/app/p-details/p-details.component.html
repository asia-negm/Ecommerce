<section class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 bg-gray-50/50">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl border border-gray-100 shadow-sm p-4 sm:p-6 md:p-8 lg:p-10">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-start">

            <!-- Product Image Gallery (Left Column) -->
            <div class="lg:col-span-5 flex flex-col gap-4">
                <!-- Main Image Card -->
                <div
                    class="w-full aspect-square bg-gray-50/40 rounded-2xl border border-gray-100 p-4 sm:p-6 flex items-center justify-center overflow-hidden group">
                    <img [src]="pDetails().imageCover"
                        [alt]="pDetails().slug"
                        [title]="pDetails().title"
                        class="w-full h-full object-contain mix-blend-multiply transition-transform duration-300 group-hover:scale-105" />
                </div>

                <!-- Thumbnails Row -->


                 <owl-carousel-o [options]="customOptions">

    @for (pImag of pDetails().images ; track $index ) {
      <ng-template carouselSlide >
        <img [src]="pImag" [alt]="pDetails().title" [title]="pDetails().title">
      </ng-template>
    }

  </owl-carousel-o>
            </div>

            <!-- Product Details & Actions (Right Column) -->
            <div class="lg:col-span-7 flex flex-col">
                <!-- Badges (Category & Brand) -->
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <span
                        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-100">
                        {{pDetails().title}}
                    </span>
                    <span
                        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 border border-gray-200">
                                                {{pDetails().brand}}

                    </span>
                </div>

                <!-- Product Title -->
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight mb-2">
                        {{pDetails().title}}
                </h1>

                <!-- Rating & Review Count -->
                <div class="flex items-center gap-2 mb-4">
                    <div class="flex items-center text-amber-400 text-sm gap-0.5" aria-label="4 out of 5 stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star text-amber-400"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-500">
                        4 (31 reviews)
                    </span>
                </div>

                <!-- Price -->
                <div class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-3">
                    149 EGP
                </div>

                <!-- Stock Availability Pill -->
                <div class="mb-5">
                    <span
                        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/60">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        In Stock
                    </span>
                </div>

                <!-- Product Attributes / Description -->
                <p class="text-sm sm:text-base text-gray-600 leading-relaxed mb-6">
                                          {{pDetails().description}}

                </p>

                <!-- Quantity Selector Section -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
                    <div class="flex items-center gap-4">
                        <!-- Counter Box -->
                        <div
                            class="inline-flex items-center border border-gray-300 rounded-xl bg-white shadow-xs overflow-hidden">
                            <button type="button" aria-label="Decrease quantity"
                                class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition-colors">
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <span
                                class="w-12 h-10 flex items-center justify-center text-sm sm:text-base font-semibold text-gray-900 select-none">
                                1
                            </span>
                            <button type="button" aria-label="Increase quantity"
                                class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition-colors">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>

                        <!-- Available Stock Info -->
                        <span class="text-sm text-gray-500 font-medium">
                            220 available
                        </span>
                    </div>
                </div>

                <!-- Total Price Card -->
                <div
                    class="bg-gray-50/90 border border-gray-100 rounded-2xl p-4 sm:p-5 flex items-center justify-between mb-6 shadow-xs">
                    <span class="text-sm sm:text-base font-medium text-gray-700">Total Price:</span>
                    <span class="text-xl sm:text-2xl font-bold text-emerald-600 tracking-tight">149.00 EGP</span>
                </div>

                <!-- Primary Action Buttons (Add to Cart / Buy Now) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <button (click)="addToProduct(pDetails()._id)" type="button"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-medium py-3.5 px-6 rounded-xl flex items-center justify-center gap-2.5 shadow-sm transition-all cursor-pointer">
                        <i class="fa-solid fa-cart-shopping text-sm"></i>
                        <span>Add to Cart</span>
                    </button>

                    <button type="button"
                        class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-medium py-3.5 px-6 rounded-xl flex items-center justify-center gap-2.5 shadow-sm transition-all cursor-pointer">
                        <i class="fa-solid fa-bolt text-sm"></i>
                        <span>Buy Now</span>
                    </button>
                </div>

                <!-- Secondary Action Buttons (Wishlist & Share) -->
                <div class="flex items-center gap-3">
                    <button type="button"
                        class="flex-1 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 text-sm transition-all shadow-xs cursor-pointer">
                        <i class="fa-regular fa-heart text-gray-500 text-sm"></i>
                        <span>Add to Wishlist</span>
                    </button>

                    <button type="button" aria-label="Share product"
                        class="w-11 h-11 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-600 hover:text-gray-900 rounded-xl flex items-center justify-center transition-all shadow-xs cursor-pointer shrink-0">
                        <i class="fa-solid fa-share-nodes text-sm"></i>
                    </button>
                </div>

            </div>

        </div>
    </div>
</section>
